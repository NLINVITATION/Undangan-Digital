<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Komang & Putri</title>
    
    <!-- Preload Gambar Utama -->
    <link rel="preload" as="image" href="cover.jpg">
    <link rel="preload" as="image" href="BACKGROUNDSLIDE1.jpg">
    <link rel="preload" as="image" href="fotoslide2.jpg">
    <link rel="preload" as="image" href="fotoslide2back.jpg">
    <link rel="preload" as="image" href="bunga1.png">

    <!-- Metadata Open Graph untuk Preview WhatsApp -->
    <meta property="og:title" content="The Wedding of Komang & Putri">
    <meta property="og:description" content="Jumat, 18 September 2026. Klik untuk melihat undangan digital kami.">
    <meta property="og:image" content="https://nlinvitation.github.io/Undangan-Digital/cover.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://nlinvitation.github.io/Undangan-Digital/">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #1a1816; color: #e5e5e5; overflow-x: hidden; }
        .serif-font { font-family: 'Cormorant Garamond', serif; }

        .desktop-frame { max-width: 440px; margin: 0 auto; min-height: 100vh; background-color: #242220; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.6); overflow-x: hidden; }

        #cover { position: absolute; inset: 0; z-index: 50; background-color: #242220; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s cubic-bezier(0.4, 0, 0.2, 1); will-change: opacity, visibility; }
        #cover.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        .wedding-slide { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; position: relative; transform: scale(0.95); opacity: 0; transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform, opacity; }
        .wedding-slide.active-slide { transform: scale(1); opacity: 1; }

        /* Bunga & Animasi lainnya tetap sama... */
        .flower-tl { position: absolute; top: 0; left: 0; width: 350px; pointer-events: none; z-index: 20; opacity: 0; }
        .flower-br { position: absolute; bottom: 0; right: 0; width: 400px; pointer-events: none; z-index: 20; opacity: 0; transform: rotate(180deg); }
        @keyframes flowerEnterTL { 0% { transform: translate(-40px, -40px) scale(0.8); opacity: 0; } 100% { transform: translate(0, 0) scale(1); opacity: 0.85; } }
        @keyframes flowerEnterBR { 0% { transform: translate(40px, 40px) rotate(180deg) scale(0.8); opacity: 0; } 100% { transform: translate(0, 0) rotate(180deg) scale(1); opacity: 0.85; } }
        .active-slide .flower-tl, #cover.active-flower .flower-tl { animation: flowerEnterTL 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
        .active-slide .flower-br, #cover.active-flower .flower-br { animation: flowerEnterBR 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }
        
        .profile-photo-frame { border-top-left-radius: 140px; border-top-right-radius: 24px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; overflow: hidden; position: relative; width: 100%; height: 480px; }
    </style>
</head>
<body class="antialiased">

    <div class="desktop-frame">
        <!-- COVER / HALAMAN DEPAN -->
        <section id="cover" class="active-flower flex flex-col items-center justify-end pb-16 bg-cover bg-center px-6 pt-8 text-center relative overflow-hidden" style="background-image: url('cover.jpg');">
            <img src="bunga1.png" alt="Bunga Hiasan" class="flower-tl">
            <img src="bunga1.png" alt="Bunga Hiasan" class="flower-br">

            <div class="relative z-30 max-w-md space-y-2.5 w-full">
                <p class="text-[11px] uppercase tracking-[0.3em] text-white font-medium drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">The Wedding Of</p>
                <h1 class="serif-font text-3xl italic text-white drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)]">Komang & Putri</h1>
                <div class="h-[1px] w-12 bg-white mx-auto drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]"></div>
                <p class="text-[11px] text-white font-medium">Om Swastiastu, Kepada Yth.</p>
                
                <div class="py-1 px-3 bg-neutral-900/40 border border-white/20 rounded-lg inline-block">
                    <span id="guest-name" class="text-xs font-medium text-white">Tamu Undangan</span>
                </div>

                <div class="pt-1.5">
                    <button onclick="openInvitation()" class="px-7 py-2.5 bg-white text-black font-medium text-[11px] uppercase tracking-widest rounded-full hover:bg-neutral-200 transition shadow-2xl cursor-pointer">
                        Buka Undangan
                    </button>
                </div>
            </div>
        </section>

        <!-- Sisa konten lainnya (Slide, Gallery, dsb) tetap sama... -->
        <!-- Pastikan Anda menyimpan kode di bawah bagian ini sesuai dengan file asli Anda -->
    </div>
    
    <!-- Tambahkan sisa script Anda di sini -->
</body>
</html>
