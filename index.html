<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Dika & Gita</title>
    
    <!-- Preload Gambar Utama -->
    <link rel="preload" as="image" href="background cover.jpg">
    <link rel="preload" as="image" href="backgroundslide1.jpg">
    <link rel="preload" as="image" href="fotoslide2.jpg">
    <link rel="preload" as="image" href="fotoslide2back.jpg">

    <!-- Metadata Open Graph untuk Preview WhatsApp -->
    <meta property="og:title" content="The Wedding of Dika & Gita">
    <meta property="og:description" content="Rabu, 19 Agustus 2026. Klik untuk melihat undangan digital kami.">
    <meta property="og:image" content="https://ekaariana1994-dotcom.github.io/Undangan-Digital/cover.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:url" content="https://ekaariana1994-dotcom.github.io/Undangan-Digital/">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #121212; color: #e5e5e5; overflow-x: hidden; }
        .serif-font { font-family: 'Cormorant Garamond', serif; }
        .desktop-frame { max-width: 440px; margin: 0 auto; min-height: 100vh; background-color: #000000; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.5); overflow-x: hidden; }
        #cover { position: absolute; inset: 0; z-index: 50; background-color: #000000; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s cubic-bezier(0.4, 0, 0.2, 1); will-change: opacity, visibility; }
        #cover.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .wedding-slide { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; position: relative; filter: blur(12px) brightness(0.4); transform: scale(0.95); opacity: 0.3; transition: filter 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: filter, transform, opacity; }
        .wedding-slide.active-slide { filter: blur(0px) brightness(1); transform: scale(1); opacity: 1; }
        .slide1-anim, .anim-up, .anim-down, .anim-left, .anim-right, .anim-zoom, .anim-rotate { opacity: 0; transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .show { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
    </style>
</head>
<body class="antialiased selection:bg-neutral-800 selection:text-white">

    <audio id="bg-music" loop>
        <source src="Chrisye - Untukku.mp3" type="audio/mpeg">
    </audio>

    <div class="desktop-frame">
        <section id="cover" class="flex flex-col items-center justify-center bg-cover bg-center px-6 py-8 text-center" style="background-image: url('background cover.jpg');">
            <div class="relative z-10 max-w-md space-y-4 w-full" data-aos="zoom-in" data-aos-duration="1200">
                <p class="text-xs uppercase tracking-[0.3em] text-white font-medium drop-shadow-md">The Wedding Of</p>
                <h1 class="serif-font text-4xl italic text-white drop-shadow-lg">Dika & Gita</h1>
                <div class="h-[1px] w-16 bg-white mx-auto"></div>
                <div class="py-2 px-4 bg-neutral-950/80 border border-neutral-600 rounded-lg inline-block backdrop-blur-sm">
                    <span id="guest-name" class="text-xs sm:text-sm font-medium text-white">Tamu Undangan</span>
                </div>
                <div class="pt-2">
                    <button onclick="openInvitation()" class="px-8 py-3 bg-white text-black font-medium text-xs uppercase tracking-widest rounded-full hover:bg-neutral-200 transition shadow-2xl">Buka Undangan</button>
                </div>
            </div>
        </section>

        <div id="main-content" class="hidden space-y-0 bg-neutral-950 min-h-screen">
            <section id="slide-1" class="wedding-slide relative h-screen justify-end p-8 text-center bg-neutral-900 border-b border-neutral-800">
                <div class="absolute inset-0"><img src="backgroundslide1.jpg" alt="Foto Slide 1" class="w-full h-full object-cover"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent"></div>
                <div class="relative z-10 space-y-3 mb-10"><h1 class="serif-font text-5xl italic text-white">Dika & Gita</h1></div>
            </section>

            <!-- Slide lainnya tetap sama, pastikan nama file di bawah disesuaikan -->
            <section class="wedding-slide relative p-8 text-center bg-cover bg-center border-b border-neutral-800" style="background-image: url('fotoslide2back.jpg');">
                <div class="absolute inset-0 bg-black/50"></div>
                <div class="relative z-10"><img src="fotoslide2.jpg" alt="Foto Slide 2" class="w-full rounded-2xl shadow-xl"></div>
            </section>

            <section class="wedding-slide relative p-8 text-center bg-cover bg-center" style="background-image: url('backpria.jpg');">
                <div class="absolute inset-0 bg-black/50"></div>
                <div class="relative z-10"><img src="foto dika.jpg" alt="Dika" class="w-56 h-72 mx-auto rounded-2xl object-cover"></div>
            </section>
            
            <section class="wedding-slide relative p-8 text-center bg-cover bg-center" style="background-image: url('backwanita.jpg');">
                <div class="absolute inset-0 bg-black/50"></div>
                <div class="relative z-10"><img src="foto gita.jpg" alt="Gita" class="w-56 h-72 mx-auto rounded-2xl object-cover"></div>
            </section>

            <!-- Bagian Galeri (Pastikan file GAL.jpg semua huruf kecil) -->
            <section class="wedding-slide p-8 grid grid-cols-3 gap-2">
                <img src="gal1.jpg" onclick="openLightbox(0)" class="col-span-2 object-cover w-full h-full rounded-xl">
                <img src="gal12.jpg" onclick="openLightbox(1)" class="col-span-1 object-cover w-full h-full rounded-xl">
                <img src="gal3.jpg" onclick="openLightbox(2)" class="col-span-1 object-cover w-full h-full rounded-xl">
                <img src="gal4.jpg" onclick="openLightbox(3)" class="col-span-2 object-cover w-full h-full rounded-xl">
            </section>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        const galleryImages = ['gal1.jpg', 'gal12.jpg', 'gal3.jpg', 'gal4.jpg', 'gal5.jpg', 'gal6.jpg'];
        function openInvitation() {
            document.getElementById('cover').classList.add('fade-out');
            setTimeout(() => { document.getElementById('main-content').classList.remove('hidden'); }, 600);
            document.getElementById('bg-music').play().catch(()=>{});
        }
    </script>
</body>
</html>
