<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Dika & Gita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #ffffff; margin: 0; font-family: sans-serif; }
        .desktop-frame { max-width: 440px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; }
        #cover { position: fixed; inset: 0; z-index: 50; background: #000000; display: flex; align-items: center; justify-content: center; }
        .fade-out { opacity: 0; visibility: hidden; transition: 0.8s; }
    </style>
</head>
<body>

    <div class="desktop-frame">
        <!-- COVER -->
        <section id="cover">
            <div class="text-center p-6">
                <h1 class="text-4xl italic mb-6">Dika & Gita</h1>
                <button onclick="bukaUndangan()" class="px-8 py-3 bg-white text-black rounded-full font-bold">
                    Buka Undangan
                </button>
            </div>
        </section>

        <!-- KONTEN -->
        <div id="konten" class="hidden p-6 space-y-10">
            <h2 class="text-2xl text-center">Selamat Datang</h2>
            <img src="gal1.jpg" alt="Foto" class="w-full rounded-xl">
            <p class="text-center">Kami mengundang Anda di hari bahagia kami.</p>
        </div>
    </div>

    <script>
        function bukaUndangan() {
            document.getElementById('cover').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('konten').classList.remove('hidden');
            }, 800);
        }
    </script>
</body>
</html>
